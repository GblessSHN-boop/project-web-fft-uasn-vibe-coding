<script>
(function () {
  var markerClass = "fft-mobile-compact-dom";

  function isMobile() {
    return window.matchMedia && window.matchMedia("(max-width: 760px)").matches;
  }

  function textOf(node) {
    return (node && node.textContent ? node.textContent : "").replace(/\s+/g, " ").trim();
  }

  function hasActionButton(node) {
    if (!node) {
      return false;
    }

    return Array.prototype.slice.call(node.querySelectorAll("a, button")).some(function (item) {
      return /Kembali|Download\s*PDF/i.test(textOf(item));
    });
  }

  function commonAncestor(nodes) {
    if (!nodes || nodes.length === 0) {
      return null;
    }

    var first = nodes[0];

    while (first && first !== document.body) {
      var ok = nodes.every(function (node) {
        return first.contains(node);
      });

      if (ok) {
        return first;
      }

      first = first.parentElement;
    }

    return null;
  }

  function findHeroFromHeading(heading) {
    var node = heading;

    for (var i = 0; node && node !== document.body && i < 8; i += 1) {
      if (hasActionButton(node)) {
        return node;
      }

      node = node.parentElement;
    }

    return heading.closest("header, section, main > div, .viewer-title, .preview-title") || heading.parentElement;
  }

  function markHero() {
    var headings = Array.prototype.slice.call(document.querySelectorAll("h1"));
    var heading = headings.find(function (item) {
      return /Brosur|Preview/i.test(textOf(item));
    });

    if (!heading) {
      return;
    }

    var hero = findHeroFromHeading(heading);

    if (!hero) {
      return;
    }

    document.documentElement.classList.add(markerClass);

    hero.setAttribute("data-fft-mobile-hero", "true");
    heading.setAttribute("data-fft-mobile-title", "true");

    Array.prototype.slice.call(hero.querySelectorAll("p")).forEach(function (paragraph) {
      paragraph.setAttribute("data-fft-mobile-desc", "true");
    });

    Array.prototype.slice.call(hero.querySelectorAll("span, small, strong")).forEach(function (item) {
      if (/E\s*-?\s*BROCHURE/i.test(textOf(item))) {
        item.setAttribute("data-fft-mobile-eyebrow", "true");
      }
    });

    var buttons = Array.prototype.slice.call(hero.querySelectorAll("a, button")).filter(function (item) {
      return /Kembali|Download\s*PDF/i.test(textOf(item));
    });

    buttons.forEach(function (item) {
      item.setAttribute("data-fft-mobile-action", "true");
    });

    var actions = commonAncestor(buttons);

    if (actions) {
      actions.setAttribute("data-fft-mobile-actions", "true");
    }
  }

  function markViewerStage() {
    var book = document.querySelector(".stf__parent, .stf__wrapper, .df-ui-wrapper, .dflip-wrapper, .dflip-book-wrapper, [class*='dflip'], [class*='flipbook']");

    if (!book) {
      return;
    }

    document.documentElement.classList.add(markerClass);
    book.setAttribute("data-fft-mobile-book", "true");

    var node = book.parentElement;

    for (var i = 0; node && node !== document.body && i < 7; i += 1) {
      node.setAttribute("data-fft-mobile-stage", "true");
      node = node.parentElement;
    }
  }

  function applyCompactMobile() {
    if (!isMobile()) {
      return;
    }

    markHero();
    markViewerStage();
  }

  function boot() {
    applyCompactMobile();
    window.setTimeout(applyCompactMobile, 80);
    window.setTimeout(applyCompactMobile, 300);
    window.setTimeout(applyCompactMobile, 900);
    window.setTimeout(applyCompactMobile, 1800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }

  window.addEventListener("load", function () {
    window.setTimeout(applyCompactMobile, 200);
  }, { once: true });

  window.addEventListener("resize", applyCompactMobile);
}());
</script>

    document.documentElement.classList.add(rootClass);
    toolbar.setAttribute("data-fft-mobile-toolbar", "true");

    var items = Array.prototype.slice.call(toolbar.children);
    var hasShare = false;

    items.forEach(function (item) {
      var text = textOf(item);

      clearItemAttrs(item);

      if (/^Sebelumnya$/i.test(text)) {
        setAttr(item, "data-fft-toolbar-prev");
        return;
      }

      if (/^Berikutnya$/i.test(text)) {
        setAttr(item, "data-fft-toolbar-next");
        return;
      }

      if (/Halaman/i.test(text)) {
        setAttr(item, "data-fft-toolbar-page");
        return;
      }

      if (/^Perbesar$/i.test(text)) {
        setAttr(item, "data-fft-toolbar-zoom-in");
        return;
      }

      if (/^Perkecil$/i.test(text)) {

  function syncMobileZoomState() {
    if (!isMobile()) {
      setZoomActive(false);

    }

    var scale = getVisualScale();
    setZoomActive(Math.abs(scale - 1) > 0.02);

    markToolbar();

    window.setTimeout(markToolbar, 120);

    window.visualViewport.addEventListener("resize", syncMobileZoomState);

  document.addEventListener("touchstart", function (event) {
    if (!isMobile()) {
      return;
    }

    if (event.touches && event.touches.length >= 2) {
      window.clearTimeout(pinchTimer);

    if (!isMobile()) {

    }
