    <div class="viewer-controls">
      <button id="prevBtn" type="button">Sebelumnya</button>
      <span id="pageInfo">Halaman 1 dari 8</span>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    const brochurePages = [
      "assets/brosur/konten-belum-tersedia-fft/cover.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-1.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-2.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-3.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-4.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-5.pdf",
      "assets/brosur/konten-belum-tersedia-fft/hal-6.pdf",
      "assets/brosur/konten-belum-tersedia-fft/back-cover.pdf"
    ];

    const bookElement = document.getElementById("book");
    const viewerLoading = document.getElementById("viewerLoading");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let pageFlip = null;
    let pageWidth = 420;
    let pageHeight = 594;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function getPageMetric(pdfFile) {
      const pdf = await pdfjsLib.getDocument(encodeURI(pdfFile)).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1 });

      return {
        baseWidth: viewport.width,
        baseHeight: viewport.height
      };
    }

    async function renderPdfPage(pdfFile, scaleValue) {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2.5);
      const pdf = await pdfjsLib.getDocument(encodeURI(pdfFile)).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: scaleValue * pixelRatio });

      const wrapper = document.createElement("div");
      wrapper.className = "page";
      wrapper.style.width = pageWidth + "px";
      wrapper.style.height = pageHeight + "px";

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });

      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      canvas.style.width = pageWidth + "px";
      canvas.style.height = pageHeight + "px";

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;

      wrapper.appendChild(canvas);
      return wrapper;
    }

    async function loadBook() {
      viewerLoading.style.display = "block";
      bookElement.style.display = "none";
      bookElement.innerHTML = "";

      try {
        const metric = await getPageMetric(brochurePages[0]);

        const targetHeight = Math.min(820, Math.max(680, window.innerHeight - 150));
        const scaleValue = targetHeight / metric.baseHeight;

        pageHeight = Math.round(metric.baseHeight * scaleValue);
        pageWidth = Math.round(metric.baseWidth * scaleValue);

        bookElement.style.width = (pageWidth * 2) + "px";
        bookElement.style.height = pageHeight + "px";

        for (const file of brochurePages) {
          const renderedPage = await renderPdfPage(file, scaleValue);
          bookElement.appendChild(renderedPage);
        }

        bookElement.style.display = "block";
        viewerLoading.style.display = "none";

        pageFlip = new St.PageFlip(bookElement, {
          width: pageWidth,
          height: pageHeight,
          size: "fixed",
          minWidth: pageWidth,
          maxWidth: pageWidth,
          minHeight: pageHeight,
          maxHeight: pageHeight,
          showCover: false,
          usePortrait: true,
          mobileScrollSupport: false,
          flippingTime: 850,
          maxShadowOpacity: 0.25,
          drawShadow: true,
          autoSize: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));
        pageFlip.on("flip", updatePageInfo);

        updatePageInfo();
      } catch (error) {
        viewerLoading.textContent = "Brosur gagal dimuat. Cek nama file PDF.";
        console.error(error);
      }
    }

    function updatePageInfo() {
      if (!pageFlip) {
        pageInfo.textContent = `Halaman 1 dari ${brochurePages.length}`;
        return;
      }

      const currentPage = pageFlip.getCurrentPageIndex() + 1;
      pageInfo.textContent = `Halaman ${currentPage} dari ${brochurePages.length}`;
    }

    prevBtn.addEventListener("click", () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener("click", () => {
      if (pageFlip) pageFlip.flipNext();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && pageFlip) {
        pageFlip.flipPrev();
      }

      if (event.key === "ArrowRight" && pageFlip) {
        pageFlip.flipNext();
      }
    });

    loadBook();
  </script>

<script id="fft-inline-dflip-toolbar-script">
(function () {
  "use strict";

  var fallbackTotal = 8;
  var zoom = 1;
  var downloadPdf = "assets/brosur/konten-belum-tersedia-fft/konten-belum-tersedia-fft.pdf";
  var toastTimer = null;

  function textOf(element) {
    return element && element.textContent ? element.textContent.trim() : "";
  }

  function parsePageText(text) {
    var match = String(text || "").match(/(?:halaman\s*)?(\d+)\s*(?:dari|\/)\s*(\d+)/i);

    if (!match) {
      return null;
    }

    return {
      current: Number(match[1]),
      total: Math.max(Number(match[2]), fallbackTotal)
    };
  }

  function findStatus() {
    var pageInfo = document.querySelector("#pageInfo");

    if (pageInfo) {
      return pageInfo;
    }

    return Array.from(document.querySelectorAll("span, div, label, p")).find(function (element) {
      return !element.closest(".fft-inline-dflip-wrap") && parsePageText(textOf(element));
    }) || null;
  }

  function getState() {
    var status = findStatus();
    var parsed = status ? parsePageText(textOf(status)) : null;

    return parsed || {
      current: 1,
      total: fallbackTotal
    };
  }

  function findButtonByText(pattern) {
    return Array.from(document.querySelectorAll("button")).find(function (button) {
      return !button.closest(".fft-inline-dflip-wrap") && pattern.test(textOf(button));
    }) || null;
  }

  function findPreviousButton() {
    return document.querySelector("#prevButton") || findButtonByText(/^sebelumnya$/i);
  }

  function findNextButton() {
    return document.querySelector("#nextButton") || findButtonByText(/^berikutnya$/i);
  }

  function findNativeControlRoot() {
    var previousButton = findPreviousButton();
    var nextButton = findNextButton();
    var status = findStatus();

    if (!previousButton || !nextButton || !status) {
      return null;
    }

    var root = status.parentElement;
    var guard = 0;

    while (root && guard < 8) {
      if (root.contains(previousButton) && root.contains(nextButton) && root.contains(status) && !root.querySelector("canvas")) {
        return root;
      }

      root = root.parentElement;
      guard += 1;
    }

    return status.parentElement;
  }

  function hideNativeControls() {
    var root = findNativeControlRoot();

    if (root) {
      root.classList.add("fft-inline-native-hidden");
      root.setAttribute("aria-hidden", "true");
    }

    return root;
  }

  function clickNav(direction) {
    var button = direction === "next" ? findNextButton() : findPreviousButton();

    if (button && !button.disabled) {
      button.click();
    }

    window.setTimeout(syncToolbar, 140);
  }

  function goToPage(target) {
    var safeTarget = Math.max(1, Math.min(Number(target) || 1, getState().total));
    var guard = 0;

    function step() {
      var state = getState();

      if (state.current === safeTarget || guard > 50) {
        syncToolbar();
        return;
      }

      clickNav(state.current < safeTarget ? "next" : "previous");
      guard += 1;
      window.setTimeout(step, 120);
    }

    step();
  }

      more: '<circle class="fill" cx="5" cy="12" r="2"></circle><circle class="fill" cx="12" cy="12" r="2"></circle><circle class="fill" cx="19" cy="12" r="2"></circle>',
      download: '<path d="M12 3v11"></path><path d="M8 10l4 4 4-4"></path><path d="M5 20h14"></path>',

    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (icons[name] || icons.more) + "</svg>";
  }

  function makeButton(className, label, iconName) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "fft-inline-dflip-btn " + className;
    button.title = label;
    button.setAttribute("aria-label", label);
    button.innerHTML = icon(iconName);
    return button;
  }

  function showToast(message) {
    var toast = document.querySelector(".fft-inline-dflip-toast");

    if (!toast) {
      return;
    }

    toast.textContent = message;
    toast.classList.add("is-open");

    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toast.classList.remove("is-open");
    }, 1600);
  }

  function closeMenus() {
    document.querySelectorAll(".fft-inline-dflip-page-menu, .fft-inline-dflip-more-menu").forEach(function (menu) {
      menu.classList.remove("is-open");
    });

    document.querySelectorAll(".fft-inline-dflip-btn.is-active").forEach(function (button) {
      button.classList.remove("is-active");
    });
  }

  function toggleMenu(menu, button) {
    var open = !menu.classList.contains("is-open");

    closeMenus();

    if (open) {
      menu.classList.add("is-open");
      button.classList.add("is-active");
    }
  }

  function rebuildPageMenu(menu) {
    var state = getState();

    menu.innerHTML = "";

    for (var page = 1; page <= state.total; page += 1) {
      var choice = document.createElement("button");
      choice.type = "button";
      choice.className = "fft-inline-dflip-page-choice" + (page === state.current ? " is-current" : "");
      choice.textContent = String(page);
      choice.dataset.page = String(page);

      choice.addEventListener("click", function () {
        closeMenus();
        goToPage(Number(this.dataset.page));
      });

      menu.appendChild(choice);
    }
  }

  function makeMenuItem(label, callback, iconName) {
    var item = document.createElement("button");
    item.type = "button";
    item.className = "fft-inline-dflip-menu-item";
    item.innerHTML = icon(iconName || "more") + "<span>" + label + "</span>";

    item.addEventListener("click", function () {
      closeMenus();
      callback();
    });

    return item;
  }

  function getBookRoot() {
    var direct = document.querySelector("#book, .book, .flipbook, .book-wrapper, .pdf-book");

    if (direct) {
      return direct;
    }

    var canvas = document.querySelector("canvas");

    if (!canvas) {
      return null;
    }

    var root = canvas.parentElement;
    var guard = 0;

    while (root && guard < 6) {
      if (root.querySelectorAll("canvas").length >= 2) {
        return root;
      }

      root = root.parentElement;
      guard += 1;
    }

    return canvas.parentElement;
  }

  function applyZoom(nextZoom) {
    zoom = Math.max(0.75, Math.min(1.6, nextZoom));

    var book = getBookRoot();

    if (book) {
      book.style.transform = "scale(" + zoom.toFixed(2) + ")";
      book.style.transformOrigin = "top center";
      book.style.transition = "transform 180ms ease";
    }

    syncToolbar();
  }

  function createToolbar() {
    var existing = document.querySelector(".fft-inline-dflip-wrap");

    if (existing) {
      return existing;
    }

    var nativeRoot = hideNativeControls();

    var wrap = document.createElement("div");
    wrap.className = "fft-inline-dflip-wrap";

    var toolbar = document.createElement("div");
    toolbar.className = "fft-inline-dflip-toolbar";
    toolbar.setAttribute("aria-label", "Toolbar preview brosur");

    var pageButton = document.createElement("button");
    pageButton.type = "button";
    pageButton.className = "fft-inline-dflip-btn fft-inline-dflip-page-btn";
    pageButton.title = "Pilih halaman";
    pageButton.setAttribute("aria-label", "Pilih halaman");
    pageButton.innerHTML = '<span class="fft-inline-dflip-page-label">1 / 8</span>';

    var gridButton = makeButton("fft-inline-dflip-grid", "Toggle Thumbnails", "grid");
    var zoomInButton = makeButton("fft-inline-dflip-zoomin", "Zoom In", "plus");
    var zoomOutButton = makeButton("fft-inline-dflip-zoomout", "Zoom Out", "minus");
    var fullButton = makeButton("fft-inline-dflip-fullscreen", "Toggle Fullscreen", "fullscreen");
    var shareButton = makeButton("fft-inline-dflip-share", "Share", "share");
    var moreButton = makeButton("fft-inline-dflip-more", "More", "more");

    var pageMenu = document.createElement("div");
    pageMenu.className = "fft-inline-dflip-page-menu";

    var moreMenu = document.createElement("div");
    moreMenu.className = "fft-inline-dflip-more-menu";

    var downloadLink = document.createElement("a");
    downloadLink.className = "fft-inline-dflip-menu-item";
    downloadLink.href = downloadPdf;
    downloadLink.target = "_blank";
    downloadLink.rel = "noopener";
    downloadLink.download = "";
    downloadLink.innerHTML = icon("download") + "<span>Download PDF File</span>";

    moreMenu.appendChild(downloadLink);
    moreMenu.appendChild(makeMenuItem("Single Page Mode", function () {
      showToast("Mode satu halaman belum aktif");
    }, "grid"));
    moreMenu.appendChild(makeMenuItem("Goto First Page", function () {
      goToPage(1);
    }, "first"));
    moreMenu.appendChild(makeMenuItem("Goto Last Page", function () {
      goToPage(getState().total);
    }, "last"));
    moreMenu.appendChild(makeMenuItem("Turn on/off Sound", function () {
      showToast("Suara belum aktif");
    }, "sound"));

    pageButton.addEventListener("click", function (event) {
      event.stopPropagation();
      rebuildPageMenu(pageMenu);
      toggleMenu(pageMenu, pageButton);
    });

    gridButton.addEventListener("click", function (event) {
      event.stopPropagation();
      rebuildPageMenu(pageMenu);
      toggleMenu(pageMenu, gridButton);
    });

    zoomInButton.addEventListener("click", function () {
      applyZoom(zoom + 0.1);
    });

    zoomOutButton.addEventListener("click", function () {
      applyZoom(zoom - 0.1);
    });

    fullButton.addEventListener("click", function () {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
        return;
      }

      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });

    shareButton.addEventListener("click", function () {
      if (navigator.share) {
        navigator.share({
          title: document.title || "Preview E Brochure",
          url: window.location.href
        }).catch(function () {});
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(window.location.href).then(function () {
          showToast("Link disalin");
        });
        return;
      }

      showToast("Salin link dari address bar");
    });

    moreButton.addEventListener("click", function (event) {
      event.stopPropagation();
      toggleMenu(moreMenu, moreButton);
    });

    toolbar.appendChild(pageButton);
    toolbar.appendChild(gridButton);
    toolbar.appendChild(zoomInButton);
    toolbar.appendChild(zoomOutButton);
    toolbar.appendChild(fullButton);
    toolbar.appendChild(shareButton);
    toolbar.appendChild(moreButton);
    toolbar.appendChild(pageMenu);
    toolbar.appendChild(moreMenu);

    var toast = document.createElement("div");
    toast.className = "fft-inline-dflip-toast";

    wrap.appendChild(toolbar);
    wrap.appendChild(toast);

    if (nativeRoot) {
      nativeRoot.insertAdjacentElement("afterend", wrap);
    } else {
      document.body.appendChild(wrap);
    }

    document.addEventListener("click", closeMenus);

    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowLeft") {
        clickNav("previous");
      }

      if (event.key === "ArrowRight") {
        clickNav("next");
      }

      if (event.key === "Escape") {
        closeMenus();
      }
    });

    return wrap;
  }

  function syncToolbar() {
    hideNativeControls();

    var wrap = document.querySelector(".fft-inline-dflip-wrap");

    if (!wrap) {
      return;
    }

    var state = getState();
    var label = wrap.querySelector(".fft-inline-dflip-page-label");

    if (label) {
      label.textContent = state.current + " / " + state.total;
    }

    var pageMenu = wrap.querySelector(".fft-inline-dflip-page-menu");

    if (pageMenu && pageMenu.classList.contains("is-open")) {
      rebuildPageMenu(pageMenu);
      pageMenu.classList.add("is-open");
    }
  }

  function boot() {
    hideNativeControls();
    createToolbar();
    syncToolbar();

    var status = findStatus();

    if (status && !status.dataset.fftInlineDflipObserverReady) {
      status.dataset.fftInlineDflipObserverReady = "1";

      new MutationObserver(syncToolbar).observe(status, {
        childList: true,
        subtree: true,
        characterData: true
      });
    }

    window.setTimeout(syncToolbar, 200);
    window.setTimeout(syncToolbar, 700);
    window.setTimeout(syncToolbar, 1400);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  window.addEventListener("pageshow", boot);
  window.setInterval(syncToolbar, 1000);
}());
</script>
