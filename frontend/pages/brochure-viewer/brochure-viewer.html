<body class="fft-standalone-viewer">

  <header class="viewer-header">
    <div class="viewer-title">
      <h1>Preview E Brochure</h1>
<p>Baca brosur digital dalam tampilan buku interaktif.</p>
    </div>

    <div class="viewer-actions">
      <a href="../e-brochure.html">Kembali</a>
      <a id="downloadPdfLink" href="assets/brosur/konten-belum-tersedia-fft/konten-belum-tersedia-fft.pdf" download>Download PDF</a>
    </div>
  </header>

  <main class="viewer-layout">
    <div id="viewerLoading" class="viewer-loading">Memuat brosur...</div>
    <div id="book" class="book"></div>

    <div class="viewer-controls">
      <button id="prevBtn" type="button">Sebelumnya</button>
      <span id="pageInfo">Halaman 1 dari 8</span>
      <button id="nextBtn" type="button">Berikutnya</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <script src="data/brochures.js?v=viewer-menu-no-close-timer-min-1-20260602"></script>

  <script>
    /* FFT_VIEWER_BACKEND_READY_DATA_CONTRACT_20260602 */
    const brochureParams = new URLSearchParams(window.location.search);
    const brochureSlug = brochureParams.get("brochure") || "utama";
    const brochureStore = window.FFT_BROCHURE_DATA || window.BROCHURES || {};
    const activeBrochure =
      brochureStore[brochureSlug] ||
      brochureStore.utama ||
      Object.values(brochureStore)[0] ||
      {};

    function normalizeBrochurePages(data) {
      if (!data) {
        return [];
      }

      const candidates = [
        data.pages,
        data.pageFiles,
        data.pdfPages,
        data.files
      ];

      for (const candidate of candidates) {
        if (Array.isArray(candidate) && candidate.length) {
          return candidate.slice();
        }
      }

      return [];
    }

    const brochurePages = normalizeBrochurePages(activeBrochure);
    const brochureDownload =
      activeBrochure.downloadUrl ||
      activeBrochure.download ||
      activeBrochure.pdfUrl ||
      activeBrochure.pdf ||
      activeBrochure.source ||
      "";

    window.FFT_ACTIVE_BROCHURE = activeBrochure;
    window.FFT_ACTIVE_BROCHURE_SLUG = brochureSlug;
    window.FFT_ACTIVE_BROCHURE_PAGES = brochurePages;
    /* /FFT_VIEWER_BACKEND_READY_DATA_CONTRACT_20260602 */

    const bookElement = document.getElementById("book");
    const viewerLoading = document.getElementById("viewerLoading");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const downloadPdfLink = document.getElementById("downloadPdfLink");

    function applyBrochureDataToPage() {
      const title = activeBrochure.title || "Preview Brosur Digital";
      const description = activeBrochure.description || "Baca brosur digital dalam tampilan buku interaktif.";

      document.title = title + " | E Brochure";

      const headerTitle = document.querySelector(".viewer-title h1");
      const headerDescription = document.querySelector(".viewer-title p");

      if (headerTitle) {
        headerTitle.textContent = title;
      }

      if (headerDescription) {
        headerDescription.textContent = description;
      }

      if (downloadPdfLink && brochureDownload) {
        downloadPdfLink.href = brochureDownload;
      }
    }

    let pageFlip = null;
    let pageWidth = 420;
    let pageHeight = 594;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function getPageMetric(pdfFile) {
      const pdf = await pdfjsLib.getDocument(encodeURI(pdfFile)).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1 });

      return {
        baseWidth: viewport.width,
        baseHeight: viewport.height
      };
    }

    async function renderPdfPage(pdfFile, scaleValue) {
      /* FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
      const isMobileRenderQuality = window.matchMedia("(max-width: 760px)").matches;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, isMobileRenderQuality ? 1.18 : 1.85);
      /* /FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
      const pdf = await pdfjsLib.getDocument(encodeURI(pdfFile)).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: scaleValue * pixelRatio });

      const wrapper = document.createElement("div");
      wrapper.className = "page";
      wrapper.style.width = pageWidth + "px";
      wrapper.style.height = pageHeight + "px";

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });

      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      canvas.style.width = pageWidth + "px";
      canvas.style.height = pageHeight + "px";

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      /* FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
      try {
        if (page && typeof page.cleanup === "function") {
          page.cleanup();
        }

        if (pdf && typeof pdf.cleanup === "function") {
          await pdf.cleanup();
        }
      } catch (cleanupError) {}
      /* /FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
wrapper.appendChild(canvas);
      return wrapper;
    }

    async function loadBook() {
      viewerLoading.style.display = "block";
      bookElement.style.display = "none";
      bookElement.innerHTML = "";

      try {
        if (!brochurePages.length) {
          throw new Error("Daftar halaman brosur kosong.");
        }

        const metric = await getPageMetric(brochurePages[0]);

        /* FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
        const isMobileViewerSize = window.matchMedia("(max-width: 760px)").matches;
        const targetHeight = isMobileViewerSize
          ? Math.min(500, Math.max(380, window.innerHeight - 270))
          : Math.min(820, Math.max(680, window.innerHeight - 150));
        /* /FFT_VIEWER_MOBILE_SAFE_RENDER_WEIGHT_20260602 */
        const scaleValue = targetHeight / metric.baseHeight;

        pageHeight = Math.round(metric.baseHeight * scaleValue);
        pageWidth = Math.round(metric.baseWidth * scaleValue);

        bookElement.style.width = (pageWidth * 2) + "px";
        bookElement.style.height = pageHeight + "px";

        for (const file of brochurePages) {
          const renderedPage = await renderPdfPage(file, scaleValue);
          bookElement.appendChild(renderedPage);
        }

        bookElement.style.display = "block";
        viewerLoading.style.display = "none";

        pageFlip = new St.PageFlip(bookElement, {
          width: pageWidth,
          height: pageHeight,
          size: "fixed",
          minWidth: pageWidth,
          maxWidth: pageWidth,
          minHeight: pageHeight,
          maxHeight: pageHeight,
          showCover: false,
          usePortrait: true,
          mobileScrollSupport: false,
          flippingTime: 850,
          maxShadowOpacity: 0.25,
          drawShadow: true,
          autoSize: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));
        pageFlip.on("flip", updatePageInfo);

    /* FFT_VIEWER_DIRECT_SPREAD_JUMP_API_20260602 */
    window.FFTBrochureViewerJumpToPage = function (pageNumber) {
      var targetPage = Number(pageNumber);

      if (!targetPage || !isFinite(targetPage) || !pageFlip) {
        return false;
      }

      var pageCount = 0;

      if (typeof pageFlip.getPageCount === "function") {
        pageCount = pageFlip.getPageCount();
      }

      if (!pageCount) {
        pageCount = document.querySelectorAll(".page").length;
      }

      targetPage = Math.round(targetPage);
      targetPage = Math.max(1, Math.min(pageCount || targetPage, targetPage));

      var targetIndex = targetPage - 1;

      if (typeof pageFlip.turnToPage === "function") {
        pageFlip.turnToPage(targetIndex);
      } else if (typeof pageFlip.flip === "function") {
        pageFlip.flip(targetIndex);
      } else {
        return false;
      }

      if (typeof updatePageInfo === "function") {
        window.setTimeout(updatePageInfo, 0);
      }

      return true;
    };

    window.FFTBrochureViewerJumpToSpread = window.FFTBrochureViewerJumpToPage;
    /* /FFT_VIEWER_DIRECT_SPREAD_JUMP_API_20260602 */


        updatePageInfo();
      } catch (error) {
        viewerLoading.textContent = "Brosur gagal dimuat. Cek nama file PDF.";
        console.error(error);
      }
    }

    function updatePageInfo() {
      if (!pageFlip) {
        pageInfo.textContent = `Halaman 1 dari ${brochurePages.length}`;
        return;
      }

      const currentPage = pageFlip.getCurrentPageIndex() + 1;
      pageInfo.textContent = `Halaman ${currentPage} dari ${brochurePages.length}`;
    }

    prevBtn.addEventListener("click", () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener("click", () => {
      if (pageFlip) pageFlip.flipNext();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && pageFlip) {
        pageFlip.flipPrev();
      }

      if (event.key === "ArrowRight" && pageFlip) {
        pageFlip.flipNext();
      }
    });

    applyBrochureDataToPage();
    loadBook();
  </script>

<script>

(function () {
  "use strict";

  function setBackButtons() {
    document.querySelectorAll("a, button").forEach(function (el) {
      var text = (el.textContent || "").trim().toLowerCase();

      if (text === "kembali" || text === "back") {
        if (el.tagName.toLowerCase() === "a") {
          el.setAttribute("href", "../e-brochure.html");
        } else {
          el.addEventListener("click", function () {
            window.location.href = "../e-brochure.html";
          });
        }
      }
    });
  }

  function addQueryClass() {
    var params = new URLSearchParams(window.location.search);
    var brochure = params.get("brochure") || "utama";
    document.documentElement.setAttribute("data-brochure", brochure);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setBackButtons();
      addQueryClass();
    });
  } else {
    setBackButtons();
    addQueryClass();
  }
}());
